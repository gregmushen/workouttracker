[project]
name = "workouttracker"
version = "0.1.0"
description = "Open-source workout/lifting tracker REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Pinned to match CI exactly. An unpinned range is how this tree ended up
    # clean locally on 0.15 and red on 0.16, which widened its default rules.
    # Bump deliberately, with the cleanup, rather than discovering it in CI.
    "ruff==0.16.1",
]

[tool.ruff.lint]
# Added on top of ruff's defaults, not instead of them. Most of these families
# are already clean here — enabling them costs nothing today and stops the
# corresponding mistakes from landing later, which is the point.
#
# Deliberately NOT enabled:
#   COM, ISC  — trailing-comma and implicit-concat rules fight a formatter;
#               ruff itself flags them as redundant when `ruff format` is used.
#   EM        — forcing exception messages into temporary variables adds noise
#               without making failures easier to diagnose.
#   ARG       — flags framework-mandated signatures: pytest fixtures requested
#               for their side effect (the `db` args) and FastAPI's catch-all
#               `path` param. Both are correct code the rule cannot see into.
extend-select = [
    "A",    # builtin shadowing
    "C4",   # comprehension rewrites
    "ERA",  # commented-out code
    "G",    # logging format
    "ICN",  # import conventions
    "INP",  # implicit namespace packages
    "N",    # pep8 naming
    "PIE",  # misc lints
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "Q",    # quote consistency
    "RET",  # return simplification
    "RSE",  # raise cleanups
    "RUF",  # ruff-specific
    "SIM",  # simplification
    "SLF",  # private member access
    "TC",   # typing-only imports
    "TID",  # tidy imports
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is expressed as a call in an argument default;
# Security(_bearer) is the documented idiom, not the mutable-default trap B008
# exists to catch. Exempting the DI callables keeps B008 meaningful everywhere
# else instead of blanket-ignoring the rule.
extend-immutable-calls = [
    "fastapi.Security",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
workouttracker = "workouttracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["workouttracker", "scripts"]
artifacts = [
    "workouttracker/static/**/*",
    "workouttracker/templates/**/*",
    "workouttracker/seed/**/*",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "alembic"
"alembic.ini" = "alembic.ini"
