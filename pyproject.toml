[project]
name = "workouttracker"
version = "0.1.0"
description = "Open-source workout/lifting tracker REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff.lint]
# Stated explicitly rather than inherited from whatever ruff's defaults happen
# to be. There was no config here, so the rule set moved with the installed
# version: ruff 0.16 widened its defaults and turned this tree red (18 findings)
# with no code change, while 0.15 passed. These are ruff's historical defaults —
# widening the set is a deliberate cleanup, not something a CI upgrade decides.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
workouttracker = "workouttracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["workouttracker", "scripts"]
artifacts = [
    "workouttracker/static/**/*",
    "workouttracker/templates/**/*",
    "workouttracker/seed/**/*",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "alembic"
"alembic.ini" = "alembic.ini"
