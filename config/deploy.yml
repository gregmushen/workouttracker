service: workouttracker
image: workouttracker

servers:
  web:
    - 192.168.1.76

registry:
  server: 192.168.1.76:5000
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    WT_DB_PATH: /data/workout.db
  secret:
    - WT_BEARER_TOKEN

volumes:
  - workouttracker_data:/data

proxy:
  host: wt.paracosmlab.com
  app_port: 8000
  healthcheck:
    path: /health
    interval: 5
    timeout: 10

builder:
  arch: amd64
  remote: ssh://gregmushen@192.168.1.76

ssh:
  user: gregmushen
  keys:
    - ~/.ssh/stupidclaw_garageband_ed25519

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: 192.168.1.76
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f
