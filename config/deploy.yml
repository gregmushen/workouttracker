service: workouttracker
image: workouttracker

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST", "127.0.0.1") %>

registry:
  server: <%= ENV.fetch("REGISTRY_SERVER", "registry.example.com") %>
  username: <%= ENV.fetch("REGISTRY_USERNAME", "kamal") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    WT_DB_PATH: /data/workout.db
  secret:
    - WT_BEARER_TOKEN

volumes:
  - workouttracker_data:/data

proxy:
  host: <%= ENV.fetch("APP_HOST", "workouttracker.example.com") %>
  app_port: 8000
  healthcheck:
    path: /health
    interval: 5
    timeout: 10

builder:
  arch: amd64
  remote: ssh://<%= ENV.fetch("DEPLOY_USER", "deploy") %>@<%= ENV.fetch("DEPLOY_HOST", "127.0.0.1") %>

ssh:
  user: <%= ENV.fetch("DEPLOY_USER", "deploy") %>
  keys:
    - ~/.ssh/deploy_key

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: <%= ENV.fetch("DEPLOY_HOST", "127.0.0.1") %>
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f
